services:
  db:
    image: mysql:8.4
    container_name: mysql_billetera
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
      MYSQL_DATABASE: ${DB_NAME:-billetera}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - billetera_net

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: backend_billetera
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-billetera}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the root .env file}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ASESOR_REGISTRATION_CODE: ${ASESOR_REGISTRATION_CODE:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      PYTHONPATH: /app
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    command: ["sh", "-c", "alembic -c Backend/alembic.ini upgrade a8c139d27e4f && alembic -c Backend/alembic.ini upgrade heads && exec uvicorn Backend.main:app --host 0.0.0.0 --port 8000 --reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - billetera_net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: billetera_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./Frontend:/app
      - frontend_node_modules_v2:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://127.0.0.1:8000}
    stdin_open: true
    tty: true
    command: npm start
    networks:
      - billetera_net

volumes:
  mysql_data:
  frontend_node_modules_v2:

networks:
  billetera_net:
    driver: bridge