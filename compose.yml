services:

  db:

    image: mysql:8.4

    container_name: mysql_billetera
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-billetera}"
      MYSQL_USER: "${MYSQL_APP_USER:-app_user}"
      MYSQL_PASSWORD: "${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in the root .env file}"

    ports:

      - "3307:3306"

    volumes:

      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 20s

    networks:

      - billetera_net


  backend:

    build:

      context: .

      dockerfile: Backend/Dockerfile

    container_name: backend_billetera

    restart: always

    depends_on:

      db:

        condition: service_healthy

    environment:

      DB_USER: "${MYSQL_APP_USER:-app_user}"
      DB_PASSWORD: "${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in the root .env file}"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: "${MYSQL_DATABASE:-billetera}"

      ASESOR_REGISTRATION_CODE: ${ASESOR_REGISTRATION_CODE:-}
      APP_ENV: "${APP_ENV:-development}"
      SECRET_KEY: "${SECRET_KEY:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      PYTHONPATH: /app

    ports:

      - "8000:8000"

    volumes:

      - .:/app

    working_dir: /app

    command: uvicorn Backend.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - billetera_net


  migrate:

    profiles:
      - maintenance

    build:

      context: .

      dockerfile: Backend/Dockerfile

    depends_on:

      db:

        condition: service_healthy

    environment:

      DB_USER: "${MYSQL_APP_USER:-app_user}"
      DB_PASSWORD: "${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in the root .env file}"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: "${MYSQL_DATABASE:-billetera}"
      PYTHONPATH: /app

    volumes:

      - .:/app

    working_dir: /app

    command: ["alembic", "-c", "Backend/alembic.ini", "upgrade", "head"]

    networks:

      - billetera_net


  frontend:

    build:

      context: ./Frontend

      dockerfile: Dockerfile

    container_name: billetera_frontend

    restart: unless-stopped

    depends_on:

      backend:
        condition: service_healthy

    working_dir: /app

    volumes:

      - ./Frontend:/app

      - frontend_node_modules:/app/node_modules

    ports:

      - "3000:3000"

    environment:

      HOST: 0.0.0.0

      CHOKIDAR_USEPOLLING: "true"

    stdin_open: true

    tty: true

    command: npm start
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - billetera_net


volumes:

  mysql_data:

  frontend_node_modules:


networks:

  billetera_net:

    driver: bridge