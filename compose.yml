services:
  db:
    image: mysql:8.4
    container_name: billetera_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: billetera
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - billetera_net

  backend:
    build:
      context: ./Backend
    container_name: billetera_backend
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: app_user
      DB_PASSWORD: app_password
      DB_NAME: billetera
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    networks:
      - billetera_net

  frontend:
    build:
      context: ./Frontend
    container_name: billetera_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    networks:
      - billetera_net

volumes:
  mysql_data:

networks:
  billetera_net:
    driver: bridge