services:
  db:
    image: postgres:17-alpine
    container_name: billetera_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: nn_user
      POSTGRES_PASSWORD: nn_password
      POSTGRES_DB: billetera

    ports:
      - "5432:5432"

    volumes:
      - billetera_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nn_user -d billetera"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - billetera_network

  be:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: billetera_backend
    restart: unless-stopped

    env_file:
      - ./Backend/.env

    environment:
      DATABASE_URL: postgresql://nn_user:nn_password@db:5432/billetera
      SECRET_KEY: dev-secret-key-change-in-production-min-32-chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      FRONTEND_URL: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - billetera_network

  fe:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000

    container_name: billetera_frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - be

    networks:
      - billetera_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: billetera_mailpit
    restart: unless-stopped

    ports:
      - "8025:8025"
      - "1025:1025"

    networks:
      - billetera_network

networks:
  billetera_network:
    driver: bridge

volumes:
  billetera_data: