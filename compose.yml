services:

  db:

    image: mysql:8.4

    container_name: mysql_billetera

    restart: always

    environment:

      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}

      MYSQL_DATABASE: ${DB_NAME:-billetera}

      MYSQL_USER: ${MYSQL_APP_USER:-app_user}

      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Define MYSQL_APP_PASSWORD en .env}

    ports:

      - "3307:3306"

    volumes:

      - mysql_data:/var/lib/mysql

    healthcheck:

      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 20s

    networks:

      - billetera_net


  backend:

    build:

      context: .

      dockerfile: Backend/Dockerfile

    container_name: backend_billetera

    restart: always

    depends_on:

      db:

        condition: service_healthy

    environment:

      DB_USER: ${MYSQL_APP_USER:-app_user}

      DB_PASSWORD: ${MYSQL_APP_PASSWORD:?Define MYSQL_APP_PASSWORD en .env}

      DB_HOST: db

      DB_PORT: 3306

      DB_NAME: ${DB_NAME:-billetera}



      ASESOR_REGISTRATION_CODE: ${ASESOR_REGISTRATION_CODE:-}

      PYTHONPATH: /app

    ports:

      - "8000:8000"

    volumes:

      - .:/app
      - backend_venv:/app/.venv

    working_dir: /app

    command: uvicorn Backend.main:app --host 0.0.0.0 --port 8000 --reload

    networks:

      - billetera_net


  frontend:

    build:

      context: ./Frontend

      dockerfile: Dockerfile

    container_name: billetera_frontend

    restart: unless-stopped

    depends_on:

      backend:

        condition: service_started

    working_dir: /app

    volumes:

      - ./Frontend:/app

      - frontend_node_modules:/app/node_modules

    ports:

      - "3000:3000"

    environment:

      HOST: 0.0.0.0

      CHOKIDAR_USEPOLLING: "true"

    stdin_open: true

    tty: true

    command: npm start

    networks:

      - billetera_net


volumes:

  mysql_data:

  backend_venv:

  frontend_node_modules:


networks:

  billetera_net:

    driver: bridge