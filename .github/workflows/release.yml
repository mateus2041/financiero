name: Release
run-name: Release ${{ inputs.version || github.ref_name }}

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión ya publicada en GHCR (sin la v), por ejemplo 1.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: produccion
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  publicar:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
