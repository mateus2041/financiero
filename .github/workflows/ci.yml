name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: "python -m pip install --only-binary=:all: --require-hashes -r Backend/requirements-dev.lock"
      - run: python -m pytest Backend/tests -q --cov=Backend --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60
        env:
          DATABASE_URL: sqlite:///./ci-test.db
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test -- --watchAll=false --coverage
        env:
          CI: "true"
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: Frontend/coverage/lcov.info
          if-no-files-found: error

  sonarcloud:
    name: SonarQube Cloud
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: Frontend/coverage
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
