name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: "python -m pip install --only-binary=:all: --require-hashes -r Backend/requirements-dev.lock"
      - run: python -m pytest Backend/tests -q --cov=Backend --cov-report=term-missing --cov-fail-under=60
        env:
          DATABASE_URL: sqlite:///./ci-test.db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test -- --watchAll=false
        env:
          CI: "true"
      - run: npm run build
